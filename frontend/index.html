<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HashGuard/title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap (allowed per assignment, easy styling) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">HashGuard</span>
    </div>
  </nav>

  <main class="container my-4">

    <!-- Backend status -->
    <div id="backend-status" class="alert alert-secondary small" role="alert">
      Checking backend status...
    </div>

    <div class="row g-4">
      <!-- Registration -->
      <div class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 card-title mb-3">Register New User</h2>
            <p class="text-muted small mb-3">
              Creates a new user in <code>users.db</code> using either bcrypt or your custom SHA-1 hash.
            </p>

            <form id="register-form" novalidate>
              <div class="mb-3">
                <label for="reg-username" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="reg-username"
                  name="username"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="reg-password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="reg-password"
                  name="password"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="reg-password-confirm" class="form-label">Confirm Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="reg-password-confirm"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="reg-hash-type" class="form-label">Hash Type</label>
                <select class="form-select" id="reg-hash-type" name="hash_type">
                  <option value="bcrypt" selected>bcrypt (salted, recommended)</option>
                  <option value="our_sha1">our_sha1 (custom SHA-1 from project)</option>
                </select>
              </div>

              <button type="submit" id="reg-submit" class="btn btn-primary w-100">
                Register
              </button>
            </form>

            <div id="reg-message" class="mt-3 small"></div>
          </div>
        </div>
      </div>

      <!-- Login -->
      <div class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 card-title mb-3">Login</h2>
            <p class="text-muted small mb-3">
              Attempts to log in an existing user using the hash type they were created with.
            </p>

            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="login-username" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="login-username"
                  name="username"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="login-password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="login-password"
                  name="password"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="login-hash-type" class="form-label">Hash Type</label>
                <select class="form-select" id="login-hash-type" name="hash_type">
                  <option value="bcrypt" selected>bcrypt</option>
                  <option value="our_sha1">our_sha1</option>
                </select>
              </div>

              <button type="submit" id="login-submit" class="btn btn-success w-100">
                Log In
              </button>
            </form>

            <div id="login-message" class="mt-3 small"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Strong password generator -->
    <div class="row mt-4">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 card-title mb-3">Strong Password Generator</h2>
            <p class="text-muted small mb-3">
              Calls <code>/api/strong_password</code> on the backend, which picks 6 random words from
              <code>google-10000-english.txt</code> using <code>secrets.SystemRandom</code>.
            </p>

            <div class="input-group mb-3">
              <input
                type="text"
                class="form-control"
                id="strong-password-output"
                placeholder="Click &quot;Generate&quot; to get a strong passphrase"
                readonly
              />
              <button
                class="btn btn-outline-primary"
                type="button"
                id="generate-password-btn"
              >
                Generate
              </button>
            </div>

            <div class="form-text">
              Pro tip: passphrases of multiple random words are easier to remember and can be very strong.
            </div>

            <div id="strong-password-message" class="mt-2 small text-muted"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
